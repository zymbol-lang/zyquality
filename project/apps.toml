# The real programs written in Zymbol, and where their test suites live.
#
# The corpus proves the language works on test cases. These prove it works on
# the programs actually written in it — a go engine, two TUI games, a
# neural-network library, a code auditor. When one of those stops working, the
# language broke in a way no test case caught.
#
# ── Why the suites are not in this repository ─────────────────────────────
#
# A suite imports the application it tests: `<# ../核/盤 => 盤`. Move the file
# and the import points at nothing. So the *programs* stay with their app, and
# their goldens sit beside them — which is what Zofia already did, and the only
# arrangement where `zyq expect` finds a pair.
#
# What is here is the part that was missing: a registry, one runner, one report,
# and a verdict that is not a grep.
#
# ── What was wrong before ─────────────────────────────────────────────────
#
# Each project had a shell runner of its own that decided correctness by
# `grep -q FAIL` over the suite's output. A suite that crashes half way through
# prints no FAIL and passes — verified, not supposed. Goldens catch that: a
# truncated run does not match.
#
# GO ran its seven suites on the tree-walker only. Put on the register VM they
# all pass, and on zyml — the OCaml engine, retired 2026-08-17 — two of them did
# not: divergences that had never been looked at because nothing had ever asked.
# `性能試験` was in the directory and not in the runner at all.
#
# ── Fields ────────────────────────────────────────────────────────────────
#
#   id     short name, used in the report and in --only
#   dir    the suite directory, relative to zyquality/
#   desc   what the application is
#   fixtures  optional: data the suites read from beside the app, copied into
#             each engine's scratch directory before every run (D9)
#
# Engines are not declared per app: `zyq` works out per file which of them can
# run a given suite, and reports "unsupported" apart from "gave a different
# answer". What *is* fixed is the set the runner asks — zytw, zyvm — and it
# excludes the browser engine on purpose. These are command-line applications;
# the browser engine has no terminal, no filesystem and no shell, so it diverges
# on every one of them and the number means nothing. Ask for it with `--engines`
# when there is a reason to.
#
# One exception, measured when it joined (2026-09-29): `gol` agrees under all
# three — its tests call the program as modules instead of reaching for a shell
# or a file — so `--only gol --engines zytw,zyvm,zyjs` is a question worth
# asking, and it is how BUG-GOL-002 was found. Its `όλα.zy` still does; its
# `έξοδος.zy` (2026-09-30) runs the program as a subscript to check what it
# says, and the browser engine has no process to run one in.
#
# `zybf` (2026-10-09) agrees under all three as well: its suite imports the
# interpreter as a module and reads no input.

[[app]]
id = "go"
dir = "../GO/試験"
desc = "go engine, written in Japanese — rules, scoring, AI, layout, text metrics"

[[app]]
id = "chaturanga"
dir = "../Chaturanga/परीक्षा"
desc = "chaturanga engine, written in Sanskrit — historical rules, alpha-beta search, five locales incl. two numeral scripts"

[[app]]
id = "serpiente"
dir = "../serpiente/pruebas"
desc = "Serpiente (snake), TUI — i18n catalogue, frame arithmetic, and the game loop's multi-value returns"

[[app]]
id = "klingon"
dir = "../klingon_galaxy/mIw"
desc = "Hov veS, TUI — i18n catalogue, composed phrases, pIqaD numerals"

[[app]]
id = "zofia"
dir = "../Zofia/tests"
desc = "neural-network library — activations, gradients, attention, forward pass"

[[app]]
id = "zyaudit"
dir = "../ZyAudit/测试"
# The suites read 源文件/计算器.zy and i18n.json relative to where they run.
# Without the copy they found an empty scratch directory, and six of the eight
# goldens recorded the shell's "No such file" — and empty labels — as the audit
# (D9, 2026-09-30).
fixtures = ["../ZyAudit/源文件", "../ZyAudit/i18n.json"]
desc = "code auditor, written in Chinese — parsing, metrics, reports, translation"

[[app]]
id = "zybank"
dir = "../ZyBank/pruebas"
desc = "ZyBank, personal ledger in Spanish — money as integers with a per-currency exponent, SQLite through std/db, four locales, two digit scripts"

[[app]]
id = "gol"
dir = "../GoL/δοκιμές"
desc = "Conway's Game of Life, written in Greek — B/S rules, torus and bounded worlds, stop diagnosis, four locales incl. Devanagari digits; the one app whose tests are all Zymbol, runner included"

[[app]]
id = "zybf"
dir = "../ZyBrainfuck/pruebas"
desc = "ZyBF, a Brainf*** interpreter in Spanish — a mini LDV of v0.0.10: its three findings changed the language, and its `.` is `##'` now; 13 cases against an independent Python oracle"
