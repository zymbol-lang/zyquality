# corpus.toml — what the corpus knows about itself.
#
# Every runner used to carry its own idea of which files it could not compare:
#
#   vm_compare.sh      a `@vm-skip` marker in line 1, an env regex
#                      VM_COMPARE_EXCLUDE, and three hard-coded paths
#   test_runner.mjs    a 40-entry SKIP_SET literal inside the JavaScript,
#                      plus a `// @skip-parity:` marker
#   parity.sh          `input/`, `manual_check.zy`, and `grep -L lib_time`
#   engine_compare.sh  nothing at all
#
# Four lists, none of which could see the others, all of them claiming to
# describe the same corpus.  A file excluded from the JavaScript comparison
# because it shells out was still counted as a divergence by zyml.  So the
# lists are merged here, once, next to the corpus they describe — a property of
# the *file*, not of whoever is running it.
#
# One rule was dropped rather than merged: parity.sh excluded all of `input/`
# because it fed every engine /dev/null.  Each of those 14 files has a `.input`
# beside it and zyq feeds it, so the exclusion described the runner, not the
# corpus, and those files are now compared.
#
# ── rule ──────────────────────────────────────────────────────────────────
#   match     glob over the corpus-relative path.  `*` stays inside a path
#             segment, `**` crosses them, `?` is one character.
#   engines   engine ids the rule applies to.  Omitted means every engine,
#             which is how you say "this file's output is not a function of
#             the program" rather than "this engine is behind".
#   tag       groups rules so a gate can drop a whole class:
#             `zyq consensus --without STD_DB`, which is what the release
#             workflow used VM_COMPARE_EXCLUDE for.
#   reason    why.  Required — an exclusion whose reason nobody wrote down is
#             indistinguishable from a bug someone hid.

# ── Output that is not a function of the program ──────────────────────────
# These are excluded for every engine.  Nothing here is an engine falling
# behind; comparing these outputs would be meaningless rather than informative.
#
# There used to be a WALL_TIME class here — `stress_v2/**` and the `lib_time`
# module it imports.  It is gone, and not because the rule was wrong: those
# files were benchmarks, so no rule could make them comparable.  They live in
# `bench/` now.  A file the corpus can never compare does not belong in the
# corpus; keeping it there means carrying an exclusion, a golden nobody checks,
# and a number in every report that has to be explained away.

[[rule]]
match = "i18n/matematicas/module.zy"
tag = "MODULE_ONLY"
reason = "re-export layer for the i18n/matematicas/ tests; has no output of its own"

# ── std/db needs ODBC ─────────────────────────────────────────────────────
# The Rust engines have std/db when built with the feature and an ODBC driver
# present; a release package has neither, which is what VM_COMPARE_EXCLUDE
# existed for.  Drop the whole class with `--without STD_DB`.

[[rule]]
match = "stdlib/stdlib_db_*.zy"
engines = ["zyjs"]
tag = "STD_DB"
reason = "std/db is ODBC; a browser has no equivalent"

[[rule]]
match = "stdlib/stdlib_i18n_db_es.zy"
engines = ["zyjs"]
tag = "STD_DB"
reason = "std/db is ODBC; a browser has no equivalent"

