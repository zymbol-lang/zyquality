# ── golden ────────────────────────────────────────────────────────────────
# How a `.expected` file was recorded, and therefore how it has to be checked.
# The last matching entry wins, so write the general case first.
#
#   via   `run` executes the program; `check` analyses it without running.
#   by    the engine whose answer this is.
#
# `by` matters because a golden is not a neutral truth: it is one engine
# printing one thing on one day.  Judging a *second* engine against it asks the
# consensus question in a noisier way and reports a stale golden where the real
# finding is a divergence.  So `zyq expect` runs the recording engine unless
# told otherwise.
#
# Two scripts knew the `via` split between them and neither said it:
# expected_compare.sh ran the program and excluded errors/semantic/,
# semantic_compare.sh checked the program and looked at nothing else.  A file
# that landed in neither scope had a golden nobody ever compared — `zyq audit`
# now reports that.

[[golden]]
match = "**"
via = "run"
by = "zytw"

# These files are supposed to fail.  Running them proves nothing; analysing
# them proves everything.
[[golden]]
match = "errors/semantic/**"
via = "check"
by = "zytw"

# ── redact ────────────────────────────────────────────────────────────────
# Applied to every engine's output before comparing.  This is not a licence to
# paper over differences: each entry names something the *network or the clock*
# decided, which no engine can be right or wrong about.  A difference an engine
# is responsible for must never be redacted.
#
#   find  a pattern in the small regex subset zyq understands:
#         literals, `.`, `[a-z]` and `[^x]` classes, and `*` `+` `?`
#   with  the literal text that replaces every match
#
# These came from vm_compare.sh's `normalize_output`, where they were five sed
# expressions no other runner applied.

[[redact]]
find = '"X-Amzn-Trace-Id": "[^"]*"'
with = '"X-Amzn-Trace-Id": "<REDACTED>"'
reason = "AWS assigns the trace id; the HTTP tests print whatever came back"

[[redact]]
find = 'Root=[A-Za-z0-9;:-]*'
with = 'Root=<REDACTED>'
reason = "same trace id in its other spelling"

[[redact]]
find = '"id": "[0-9a-f-]*"'
with = '"id": "<UUID>"'
reason = "server-assigned identifier"

[[redact]]
find = '"uuid": "[0-9a-f-]*"'
with = '"uuid": "<UUID>"'
reason = "server-assigned identifier"

[[redact]]
find = 'date: [A-Za-z]*, [0-9]* [A-Za-z]* [0-9]* [0-9:]* GMT'
with = 'date: <DATE>'
reason = "the clock, not the program"

# ── wildcard ──────────────────────────────────────────────────────────────
# What a marker in an `.expected` golden file may stand for.  A golden line is
# matched against the whole line, with everything outside a marker taken
# literally.  `****` is built in and matches any run of characters within the
# line; the typed markers are declared here, so `***int***` means the same
# thing to every runner that reads a golden.
#
# expected_compare.sh built these as Python regexes and fell back to a plain
# `****` glob when python3 was absent, which quietly turned "an integer goes
# here" into "anything at all goes here" — on a machine where you would never
# think to check.  zyq has no fallback because it has no dependency.
#
# Order matters: markers are recognised longest-first, so `***float***` is
# tried before `***int***` and `****` last.  The patterns below are the ones
# expected_compare.sh used, kept identical — 553 golden files were written
# against them and a "better" pattern here is a mass rewrite, not an
# improvement.

[[wildcard]]
name = "int"
pattern = '-?[0-9]+'

[[wildcard]]
name = "float"
pattern = '-?[0-9]+(\.[0-9]+)?([eE][+-]?[0-9]+)?'

# Deliberately not the same as `float`: no exponent.  That is what the Python
# table said, and widening it here would make goldens accept output they were
# written to reject.
[[wildcard]]
name = "num"
pattern = '-?[0-9]+(\.[0-9]+)?'

# `µs` is two bytes in UTF-8, so the units are spelled out as alternatives
# rather than as a character class.  Longest first: `ms` before `s`.
[[wildcard]]
name = "time"
pattern = '[0-9]+(\.[0-9]+)?(ms|µs|us|ns|s)'

[[wildcard]]
name = "date"
pattern = '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]'

# Python's \S.  Matched per line, so a newline cannot appear here anyway.
[[wildcard]]
name = "path"
pattern = '[^ \t\r]+'
