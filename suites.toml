# Suites that are not `zyq` itself.
#
# `zyq` answers the differential questions — do the engines agree, do the
# goldens still hold, is every refused form still refused. Some questions are
# not differential, or cannot be asked through a pipe, and those are scripts.
# They are registered here so `zyq suite` runs them too, and so the project has
# **one** command that means "run the tests".
#
# They used to be spread across three repositories with no common entry point:
# the formatter audit and the benchmark gate beside the interpreter, the pty
# harness beside zyml, the GUIDE verification in a Python file nobody invoked.
# Each was documented; none was in a gate.
#
# Fields:
#
#   id       short name, used in the report and in `--only`
#   cmd      argv, relative to zyquality/
#   desc     what question it answers
#   needs    what has to exist for it to mean anything.  A suite whose needs
#            are missing is reported as skipped, never as a pass:
#              zymbol | python3           a program on PATH (or via *_BIN)
#              tty                        allocates a pty
#              interpreter                the sibling interpreter/ checkout
#              zyfmtcheck | zyddt         the sibling repository that holds the
#                                         runner — without it the shell answers
#                                         127 and a missing clone reads as a
#                                         broken formatter
#   gate     true  = a failure makes `zyq suite` red
#            false = reported, but does not fail the gate.  For suites that
#                    measure something machine-dependent, or that grade a
#                    document rather than the language.

[[suite]]
id = "fmt"
cmd = ["bash", "fmt/fmt_property.sh", "--baseline", "fmt/baseline.txt"]
desc = "formatter properties P1-P4 over the corpus (reparse, idempotence, semantics, comments)"
needs = ["zymbol"]
gate = true

[[suite]]
id = "fmtcheck"
cmd = ["../ZyFmtCheck/bin/zyfmtcheck"]
desc = "ZyFmtCheck: the formatter moved things and changed nothing — over the LDV applications, in a copy, and run again"
needs = ["zymbol", "python3", "zyfmtcheck"]
# A gate, and it earned it on the first run: the two behaviours it found are
# fixed, so green here is a fact rather than a hope.
#
# It asks what P1-P4 and the formatter's own gate structurally cannot. The token
# gate compares `TokenKind`, which carries the VALUE and not the spelling, so
# `४२` and `42` are one token — printing one for the other passed for four
# releases with P1-P4 green throughout. This compares the code and the comments
# and lets layout through.
#
# It lives in its own repository on purpose. The list of what the formatter may
# do is a contract, and a contract that lives inside the thing it constrains is
# not one.
gate = true

[[suite]]
id = "tui"
cmd = ["bash", "tui/run.sh"]
desc = "key input and raw mode through a real pty: engines against each other, and against a golden where one is recorded"
needs = ["zymbol", "python3", "tty"]
gate = true

[[suite]]
id = "guide"
cmd = ["python3", "docs/guide_verify.py"]
desc = "every annotated example in the interpreter's GUIDE.md still produces what it claims"
needs = ["zymbol", "python3", "interpreter"]
# Not a gate: it grades a document against the language, so it goes red when
# the docs fall behind — which is worth knowing and is not a regression in any
# engine.
gate = false

[[suite]]
id = "lsp"
cmd = ["python3", "lsp/lsp_parity.py"]
desc = "the corpus through the language server, against `zymbol check` — the editor's answer and the command line's"
needs = ["zymbol", "zymbol-lsp", "python3"]
# Not a gate, and the reason is the whole point of the suite: the commonest way
# this goes red is that somebody's *editor* is running a language server started
# before the last build, which is not a defect in anything committed. Run it to
# tell that apart from a real divergence — clean here while the editor is not
# means the editor's server is stale.
gate = false

[[suite]]
id = "project"
cmd = ["bash", "project/run.sh"]
desc = "the real programs written in Zymbol: a go engine, two TUI games, a neural-network library, a code auditor"
needs = ["zymbol"]
# A gate. These suites are the strongest regression signal the project has: a
# test case failing says a feature broke, an application failing says something
# people rely on broke. An app whose checkout is not present is reported absent
# and not counted, so this works in a partial workspace.
gate = true

[[suite]]
id = "addressing"
cmd = ["python3", "addressing/harness.py"]
desc = "the bracket rule as a product: every action after a chained receiver refused, after a navigator receiver agreed"
needs = ["python3", "zymbol"]
# A gate, and the one suite here that makes a CLAIM rather than asking a
# question. It has to: the hole it exists to close was three engines wrongly
# ACCEPTING the same program, which a consensus run cannot see — they agreed
# perfectly. `reject/` makes the same kind of claim one hand-written file at a
# time; this one crosses the receiver with the whole action vocabulary, so a
# form nobody thought of is asked anyway.
gate = true

[[suite]]
id = "messages"
cmd = ["python3", "messages/extract.py"]
desc = "the diagnostic inventory: every message one engine defines and the other does not, against a recorded baseline"
needs = ["python3"]
gate = true

[[suite]]
id = "bench"
cmd = ["bash", "bench/bench_gate.sh"]
desc = "benchmarks against a recorded baseline"
needs = ["zymbol"]
# Not a gate: the baseline is wall time on one machine, so it is only true on
# the machine that recorded it. Enforce it in CI by running `zyq suite --only
# bench` on the runner that owns the baseline.
gate = false

[[suite]]
id = "zyddt"
cmd = ["../ZyDDT/bin/zyddt", "suite"]
desc = "ZyDDT: the declared matrix — every engine asked the same cell, and the pins that name a finding"
needs = ["zymbol", "python3", "zyddt"]
# A gate. It asks what a corpus of whole programs structurally cannot: a cell is
# one point in a crossed matrix, so a form nobody thought to write a file for is
# asked anyway. The first crossing of `operator` — 14 operators × 18 type pairs
# — was 150 red cells on its first run and six real findings behind them, none
# of which the 666-file corpus could see, because the engines agreed with each
# other about every program anybody had bothered to write down.
#
# It also grades the two surfaces this repository has no engine for: the
# playground's highlighter and the VS Code grammar. They never run a program, so
# consensus has nothing to compare — they are asked what they left unmarked.
#
# On the layering: ZyDDT's CHARTER declares it the successor to this repository,
# not a suite inside it. Registering it here is about the command, not the
# hierarchy — `zyq suite` has to mean "run the tests", and a layer that has to be
# remembered separately is a layer that gets forgotten before a release. It runs
# from its own checkout, with its own runner and its own exit codes; nothing here
# knows how it works.
gate = true

[[suite]]
id = "cost"
cmd = ["./cost/run.py"]
desc = "the cost gate: auto-free measured against a control, and complexity measured against itself"
needs = ["zymbol", "python3"]
# The only suite here that asserts a RATIO rather than a value. Two things it
# sees that nothing else does:
#
#   · auto-free. It is required to be invisible — same output with and without
#     it — so no consensus run, no golden and no cell can observe it at all. Its
#     only trace is peak memory, and the only way to read that is against a
#     control whose values may not be released.
#   · a change of complexity. `bench/` runs each program at one size and compares
#     ms against a machine-specific baseline, so linear-turned-quadratic reads as
#     "slower" until the input grows and it reads as a hang. This runs the same
#     program at N and 4N; the limit sits between linear and quadratic.
#
# No baseline, deliberately: a baseline must be re-recorded per machine, and
# re-recording is the move that absorbs a regression. A case that fails while
# naming an `open_finding` is reported as KNOWN and does not turn the gate red —
# declared debt is not a regression, and a gate that is permanently red stops
# meaning anything.
