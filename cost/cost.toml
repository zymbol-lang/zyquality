# What a program may cost, stated as a RATIO and never as a number.
#
# ── Why not a baseline ───────────────────────────────────────────────────────
#
# `bench/baseline.txt` records milliseconds and says so in its own header:
# "machine-specific … host=zymbol". That is the right instrument for "did this
# get slower", and the wrong one for "does this mechanism still work": the
# number has to be re-recorded on every machine, and a re-recording is exactly
# the move that makes a regression disappear.
#
# Every case here carries its own control, measured in the same run, on the same
# machine, within seconds of the subject. What is asserted is the RATIO between
# them. A ratio needs no baseline, survives a faster laptop, and cannot be
# quietly re-recorded — to move it you have to change the number in this file,
# where it is read as what it is.
#
# ── The two kinds ────────────────────────────────────────────────────────────
#
#   peak-ratio    subject vs control, peak RSS.  Auto-free is required to be
#                 INVISIBLE — same output with and without it — so memory is the
#                 only place it can be observed at all. The pair differs in the
#                 LIFETIMES of its values and in nothing else: same allocations,
#                 same loops, same output shape.
#
#   growth-ratio  the same program at N and at N × factor, wall time. Detects a
#                 change of COMPLEXITY, which no single measurement can: linear
#                 is `factor`, quadratic is `factor²`, and the limit sits
#                 between them. This is what `bench/` structurally cannot see —
#                 it runs each program at one size.
#
#   time-ratio    subject vs control, wall time, at one size: the same work
#                 written two ways, so the ratio is the price of the one
#                 difference between them. Added for the cost of a function call
#                 in a hot loop (IDEA-GOL-007).

# ── `open_finding` ───────────────────────────────────────────────────────────
#
# A case that names one is KNOWN rather than FAILED: it is reported, in full,
# with the finding's id, and it does not turn the gate red. Debt that has been
# written down is not a regression, and a gate that is permanently red stops
# meaning anything — which is the whole value of `zyquality`'s green baseline.
#
# It is keyed BY ENGINE, because a finding belongs to an engine: writing it for
# the case made the runner announce "ZYJS-014 now passes" every time zytw met
# the limit, which is an engine reporting on another engine's bug.
#
# It is not an exclusion and it is not a skip: the case still RUNS and its ratio
# is still printed, so the number moves in the report as the work progresses.
# And the day it passes, the case is RED until the finding is closed and the
# marker removed — a `open_finding` that nobody removes is the way debt becomes
# permanent, and the way the next regression of the same case gets in unseen.
# It used to print in green and move on (changed 2026-10-02, the rule ZyDDT's
# `open_finding` follows: VERDICTS.md § 12).

[defaults]
runs_time = 3          # median; memory is deterministic enough to take once
min_base_ms = 40       # a growth ratio whose base run is faster than this is
                       # measuring process startup, not the program: reported as
                       # NO VERDICT rather than as a pass nobody should trust
engines   = ["zytw", "zyvm"]

# ── Auto-free ────────────────────────────────────────────────────────────────

[[case]]
id       = "autofree/two-aggregates"
kind     = "peak-ratio"
subject  = "casos/autofree_secuencial.zy"
control  = "casos/autofree_solapado.zy"
max_ratio = 0.70
what     = "two aggregates used one after the other must not cost two aggregates"
# Measured 2026-09-12: zytw 237/465 = 0.51, zyvm 38.7/70.4 = 0.55. The limit is
# 0.70, which leaves room for allocator noise and still fails loudly: with
# auto-free off the subject IS the control and the ratio is 1.00.
why      = "if the ratio approaches 1, the first aggregate is surviving its last use"

[[case]]
id       = "autofree/scale"
kind     = "peak-ratio"
subject  = "casos/autofree_secuencial.zy"
control  = "casos/autofree_uno.zy"
max_ratio = 1.25
what     = "two aggregates used in sequence cost about the same as one"
# The sharper half. Measured 2026-09-12: zytw 1.00, zyvm 1.03.
why      = "states the mechanism positively: the second array reuses the first one's ground"

# ── Cost curves ──────────────────────────────────────────────────────────────

# `n_by_engine` — one question, asked at the size each engine can answer it at.
#
# The sizes cannot be shared: at 5 000 the Rust engines spend most of the run
# starting a process (a ratio of two startup times measures the startup, which
# is what `min_base_ms` refuses), and at 200 000 the browser engine needs
# minutes. Splitting this into two cases would make it two questions, and the
# day one is fixed nobody would notice the other still asks the same thing.

[[case]]
id        = "growth/append-local"
kind      = "growth-ratio"
template  = "casos/append_local.zy.in"
# 600 000 and not less: the VM builds 200 000 in 16 ms, which is under the
# floor — the faster the engine, the larger the case has to be for its own ratio
# to mean anything.
n         = 600000
n_by_engine = { zyjs = 5000, zyvm = 1200000 }
factor    = 4
max_ratio = 6.0
what      = "building an array element by element is linear in its length"
# Linear would be 4.0; quadratic 16.0. Measured 2026-09-12: zyjs 13.2.
why       = "an aggregate rebuilt on every append is quadratic in its length"
engines   = ["zytw", "zyvm", "zyjs"]
open_finding = { zyjs = "ZYJS-014" }

[[case]]
id        = "growth/append-module-state"
kind      = "growth-ratio"
template  = "casos/append_modulo.zy.in"
n         = 400000
n_by_engine = { zyvm = 8000 }
factor    = 4
max_ratio = 6.0
what      = "accumulating into a module's own state is linear, like a local"
# Measured 2026-09-12: zytw 1.2, zyvm 18.0 — ZYVM-003, open. The VM is the
# future default engine and a module that accumulates is an ordinary module.
why       = "two owners of one Rc across a load/store make every append copy the vector"
open_finding = { zyvm = "ZYVM-003" }

[[case]]
id        = "growth/update-local"
kind      = "growth-ratio"
template  = "casos/actualizar_local.zy.in"
# The tree-walker writes in place and needs a large N to clear the floor; the
# VM and zyjs copy the collection on every write and are asked where that is
# still seconds, not minutes.
n         = 200000
n_by_engine = { zyvm = 4000, zyjs = 5000 }
factor    = 4
max_ratio = 6.0
what      = "writing one element of a collection in place costs the same whatever its size"
# Measured 2026-10-10: 2000 writes over 16 000 elements are 33 M instructions in
# the tree-walker and 1 202 M in the VM. The compiler emits `CopyReg` before
# every `DeepSet`, so the register and the copy are two owners and the write
# copies the vector — on a plain local, in a function, with a literal index.
why       = "a second owner of the collection at the moment of the write makes the write copy all of it"
engines   = ["zytw", "zyvm", "zyjs"]
open_finding = { zyvm = "ZYVM-013", zyjs = "ZYJS-014" }

[[case]]
id        = "growth/update-module-state"
kind      = "growth-ratio"
template  = "casos/actualizar_modulo.zy.in"
n         = 200000
n_by_engine = { zyvm = 3000 }
factor    = 4
max_ratio = 6.0
what      = "writing one element of a module's own state costs the same whatever its size"
# Measured 2026-10-10: ZYVM-003 is every edit of module state, not only `$+`.
why       = "two owners of one Rc across a load/store make every write copy the collection"
open_finding = { zyvm = "ZYVM-003" }

[[case]]
id        = "growth/write-through-an-output-parameter"
kind      = "growth-ratio"
template  = "casos/salida_por_llamada.zy.in"
n         = 2000
n_by_engine = { zyvm = 4000, zyjs = 6000 }
factor    = 4
max_ratio = 6.0
what      = "a call that writes one element through `<~` costs what the write costs"
# Measured 2026-10-10: 2000 calls over 16 000 elements are 2 808 M instructions
# in the tree-walker and 1 204 M in the VM; the same writes in line are 33 M in
# the tree-walker. An output parameter is copied in and written back, so while
# the call lasts the caller's variable and the parameter are two owners.
why       = "an output parameter that is copied in and written back copies the collection on every call"
engines   = ["zytw", "zyvm", "zyjs"]
open_finding = { zytw = "GLB-117", zyvm = "GLB-117", zyjs = "GLB-117" }

[[case]]
id        = "growth/sort-with-comparator"
kind      = "growth-ratio"
template  = "casos/sort_comparador.zy.in"
# Sizes chosen so each engine's base run clears the 40 ms floor: after the merge
# sort the old 500 ran in 16 ms on the tree-walker and 1000 in 8 ms on the VM,
# which would have measured process start-up. zyjs stays at 500 — larger, and
# the `$+` that builds the array (ZYJS-014) would be what grows.
n         = 8000
n_by_engine = { zyvm = 32000, zyjs = 500 }
factor    = 4
max_ratio = 6.0
what      = "sorting with a comparator of one's own grows as n log n, like the natural order"
# Measured 2026-10-08: zytw 14.0, zyvm 13.9 — the three engines ran the same
# bubble sort with no early exit (GLB-108). Corrected 2026-10-09: a bottom-up
# merge sort, the same call for call in the three, stable by GLB-073's rule B.
why       = "a sort that visits every pair grows as n²: the bubble sort GLB-108 replaced"
engines   = ["zytw", "zyvm", "zyjs"]

[[case]]
id        = "growth/caught-errors"
kind      = "growth-ratio"
template  = "casos/errores_capturados.zy.in"
# The VM catches 1 600 000 in about the time the tree-walker takes for 400 000,
# so each engine is asked at a size where its own base run clears the floor.
n         = 400000
n_by_engine = { zyvm = 1600000, zyjs = 20000 }
factor    = 4
max_ratio = 6.0
what      = "catching an error costs the same on the thousandth turn as on the first"
# Measured 2026-09-14 before the fix: zytw 19.5 (20 000 → 0.61 s, 80 000 →
# 11.9 s, and 33 MB → 110 MB). ZYTW-003: every caught error left the scopes it
# was raised in open, so every later lookup walked all of them.
why       = "an error that leaves blocks without popping their scopes makes each lookup slower than the last"
engines   = ["zytw", "zyvm", "zyjs"]

# ── The price of a call ──────────────────────────────────────────────────────

[[case]]
id        = "call/function-in-hot-loop"
kind      = "time-ratio"
subject   = "casos/llamada_por_celda.zy.in"
control   = "casos/en_linea.zy.in"
n         = 160
n_by_engine = { zytw = 64 }
max_ratio = 1.30
what      = "a Life generation with a call per cell costs little more than the same code inline"
# Measured 2026-09-30, side 160, median of 12 interleaved runs: zyvm 1.14,
# zytw 0.87 (the tree-walker is FASTER with the call: its per-scope cost is
# lower in a fresh frame). GoL's own bench had said 1.39 for the VM on
# 2026-09-04; it says 1.22 today, and its call variant also does work the
# inline one does not, so it overstated the call.
#
# What the 14 % is made of, as far as could be measured without a profiler
# (none on this machine): the call machinery itself is 2-5 % — the same
# control with an EMPTY five-argument call per cell; preparing and dropping a
# 34-register frame instead of a 5-register one is ~55 ns of the ~280 ns
# extra per call; the six auto-free LoadUnits before the callee's `<~` were
# measured, removed, made no difference, and were put back.
#
# Profiled 2026-10-01 with perf (side 160, binaries with symbols and frame
# pointers): the call is work, not layout — ~1 900 machine instructions and
# ~1 500 cycles more per call. Over half the gap is dropping Values: tearing
# down the callee's frame (34 registers, because alloc_temp never reuses a
# temporary) and the drop every register write makes of the old value. That
# second cost is ~11 % of the run even inline, so it is not this cell's: it is
# ZYVM-010 (ZyDDT/HALLAZGOS/zyvm.md). The limit catches a regression of the
# call path, not that.
why       = "if this climbs, a call in a hot loop got dearer — frame setup, argument copy, or what runs at return"

